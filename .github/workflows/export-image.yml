name: Download published Docker image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Save published Apple Silicon image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          docker pull --platform linux/arm64 "$IMAGE"
          docker image inspect "$IMAGE" --format '{{.Id}} {{.Architecture}} {{json .RepoDigests}}' > image-details.txt
          docker save "$IMAGE" | gzip -1 > inventory-agent-arm64.tar.gz
          sha256sum inventory-agent-arm64.tar.gz > SHA256SUMS
      - name: Upload downloadable image
        uses: actions/upload-artifact@v4
        with:
          name: inventory-agent-arm64
          path: |
            inventory-agent-arm64.tar.gz
            SHA256SUMS
            image-details.txt
          compression-level: 0
          retention-days: 30
